<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC",serif;background:#f6eddc;color:#382719}header{text-align:center;padding:65px 18px 40px;background:linear-gradient(#ecd49b,#a67c4c)}h1{font-size:43px;color:#781e28;margin:10px}.lead{font-size:19px}.cta{background:#701f29;color:white;border:0;border-radius:18px;padding:16px 24px;font-size:18px;margin:6px}main{max-width:850px;margin:auto;padding:25px 16px}h2{color:#781e28;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.god{padding:15px 8px;border:1px solid #c7a56c;background:#fffaf0;border-radius:15px;font-size:16px}#box{display:none;background:#fff;border:2px solid #b88945;border-radius:20px;padding:20px;margin:20px 0;text-align:center}.note{font-size:13px;line-height:1.7;background:#eadcc2;padding:14px;border-radius:12px;margin-top:22px}</style></head>
<body><header><div>⚡ 🏛️ ❤️ 🏛️ ⚡</div><h1>奥林匹斯·神爱乱谱</h1><p class="lead">众神的爱情，比神话更乱。</p><p>神很多，关系更多。点开之前，请先系好安全带。😂</p><button class="cta" onclick="randomGod()">🍿 点神吃瓜</button><button class="cta" onclick="birth()">💘 测神界身份</button></header>
<main><div id="box"></div><h2>众神关系宇宙</h2><div class="grid"><button class='god' onclick="pick('宙斯')">宙斯</button><button class='god' onclick="pick('赫拉')">赫拉</button><button class='god' onclick="pick('波塞冬')">波塞冬</button><button class='god' onclick="pick('哈迪斯')">哈迪斯</button><button class='god' onclick="pick('珀耳塞福涅')">珀耳塞福涅</button><button class='god' onclick="pick('德墨忒尔')">德墨忒尔</button><button class='god' onclick="pick('阿佛洛狄忒')">阿佛洛狄忒</button><button class='god' onclick="pick('阿瑞斯')">阿瑞斯</button><button class='god' onclick="pick('赫淮斯托斯')">赫淮斯托斯</button><button class='god' onclick="pick('阿波罗')">阿波罗</button><button class='god' onclick="pick('阿尔忒弥斯')">阿尔忒弥斯</button><button class='god' onclick="pick('雅典娜')">雅典娜</button><button class='god' onclick="pick('赫尔墨斯')">赫尔墨斯</button><button class='god' onclick="pick('狄俄尼索斯')">狄俄尼索斯</button><button class='god' onclick="pick('厄洛斯')">厄洛斯</button><button class='god' onclick="pick('克洛诺斯')">克洛诺斯</button><button class='god' onclick="pick('瑞亚')">瑞亚</button><button class='god' onclick="pick('盖亚')">盖亚</button><button class='god' onclick="pick('乌拉诺斯')">乌拉诺斯</button><button class='god' onclick="pick('塞勒涅')">塞勒涅</button><button class='god' onclick="pick('厄俄斯')">厄俄斯</button><button class='god' onclick="pick('普罗米修斯')">普罗米修斯</button><button class='god' onclick="pick('赫卡忒')">赫卡忒</button><button class='god' onclick="pick('塞墨勒')">塞墨勒</button><button class='god' onclick="pick('勒托')">勒托</button><button class='god' onclick="pick('伊娥')">伊娥</button><button class='god' onclick="pick('欧罗巴')">欧罗巴</button><button class='god' onclick="pick('达芙妮')">达芙妮</button><button class='god' onclick="pick('阿多尼斯')">阿多尼斯</button><button class='god' onclick="pick('阿里阿德涅')">阿里阿德涅</button><button class='god' onclick="pick('海伦')">海伦</button><button class='god' onclick="pick('帕里斯')">帕里斯</button><button class='god' onclick="pick('赫拉克勒斯')">赫拉克勒斯</button><button class='god' onclick="pick('忒修斯')">忒修斯</button></div><div class="note">❤️爱情　💍婚姻　💔悲剧/拒绝　👶后代　🩸血缘<br>希腊神话存在多个古典传统，同一人物的关系可能因来源不同而不同；正式关系页将标注主要版本。</div></main>
<script>const gods=['宙斯', '赫拉', '波塞冬', '哈迪斯', '珀耳塞福涅', '德墨忒尔', '阿佛洛狄忒', '阿瑞斯', '赫淮斯托斯', '阿波罗', '阿尔忒弥斯', '雅典娜', '赫尔墨斯', '狄俄尼索斯', '厄洛斯', '克洛诺斯', '瑞亚', '盖亚', '乌拉诺斯', '塞勒涅', '厄俄斯', '普罗米修斯', '赫卡忒', '塞墨勒', '勒托', '伊娥', '欧罗巴', '达芙妮', '阿多尼斯', '阿里阿德涅', '海伦', '帕里斯', '赫拉克勒斯', '忒修斯'];function pick(x){let b=document.getElementById('box');b.style.display='block';b.innerHTML='<b style="font-size:25px">'+x+'</b><br><br>关系故事将在下一版展开 ❤️';b.scrollIntoView({behavior:'smooth'})}function randomGod(){pick(gods[Math.floor(Math.random()*gods.length)])}function birth(){let s=prompt('输入生日，例如 1976-06-03');if(!s)return;let n=[...s].filter(c=>c>='0'&&c<='9').reduce((a,c)=>a+Number(c),0);pick(gods[n%gods.length])}</script></body></html>
